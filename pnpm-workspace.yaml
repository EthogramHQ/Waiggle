packages:
  - apps/*
  - apps/api/runtime
  - packages/*

# Scripts d'installation des dépendances (protection de la chaîne d'approvisionnement) : `true`, le
# seul autorisé à tourner ; `false`, relu et volontairement pas lancé (on prend leurs binaires déjà
# compilés). Un paquet absent de la liste ne lance rien, et pnpm 11 ou plus refuse l'installation
# tant qu'il n'y est pas classé. `allowBuilds` existe depuis pnpm 10.26 et remplace
# `onlyBuiltDependencies` et `ignoredBuiltDependencies`, que pnpm 11 a retirés.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  unrs-resolver: false

# Protections de la chaîne d'approvisionnement (audit de sécurité du 25/10/2026, C8). Le risque :
# un compte de mainteneur volé publie une version piégée d'un paquet connu ; elle est repérée et
# retirée du registre en quelques heures, mais toute installation faite entre-temps l'a prise.
# Ces trois réglages existent depuis pnpm 10.28.0. Avec pnpm 10, ils jouent quand pnpm choisit une
# version (ajout, mise à jour) ; `pnpm install --frozen-lockfile` (la CI, le serveur) reprend les
# versions déjà notées dans pnpm-lock.yaml sans les revérifier. Depuis pnpm 12, toute installation,
# même figée, revérifie aussi chaque entrée du verrou contre ces règles.
#
# Âge minimum d'une version avant que pnpm accepte de l'installer, en minutes : 7 jours
# (7 × 24 × 60). Une version piégée a presque toujours été retirée avant.
minimumReleaseAge: 10080
# Exceptions à cet âge minimum (accord de Louis du 29/10/2026), chacune datée et retirée à sa date :
# - les 33 versions entrées par la PR Renovate #39 (25/10/2026), fusionnée 23 minutes avant
#   l'arrivée de cette règle (Biome 2.6.3, Better Auth 1.7.13, Hono, i18next, Babel…). Tant que l'une
#   a moins de 7 jours, pnpm refuse toute installation. Elles sont déjà installées, et en ligne
#   depuis le 28/10 : l'exception ne fait entrer rien de neuf. À retirer le 1/11/2026 après 18 h 30
#   (la plus jeune date du 25/10 à 17 h 29 UTC).
# - decode-uri-component : la 0.5.1 corrige une faille (GHSA-qr28-fpjm-wq7f, voir `overrides`) et
#   n'a que 6 jours le 29/10/2026. À retirer le 30/10/2026 après 13 h 50.
minimumReleaseAgeExclude:
  - '@babel/helper-string-parser'
  - '@babel/parser'
  - '@babel/plugin-transform-block-scoping'
  - '@babel/plugin-transform-classes'
  - '@babel/types'
  - '@better-auth/*'
  - '@better-fetch/fetch'
  - '@biomejs/*'
  - auth
  - baseline-browser-mapping
  - better-auth
  - electron-to-chromium
  - hono
  - i18next
  - react-i18next
  - decode-uri-component
# Une dépendance indirecte ne peut pas venir d'ailleurs que du registre (dépôt Git, archive à une
# adresse quelconque) : une telle source échappe aux vérifications du registre et peut changer sans
# changer de numéro de version.
blockExoticSubdeps: true
# Refuse une version publiée avec moins de garanties que les précédentes : si un paquet était publié
# par sa CI avec une preuve de provenance et qu'une nouvelle version arrive sans (publiée à la main,
# depuis un compte peut-être volé), pnpm refuse de l'installer.
trustPolicy: no-downgrade
# Exceptions à cette règle (accord de Louis du 29/10/2026). pnpm compare les versions par date, toutes
# lignes confondues : une ligne ancienne encore maintenue, publiée à la main par son mainteneur
# habituel, paraît « moins sûre » qu'une ligne récente publiée par CI avec preuve de provenance.
# - Expo SDK 57 : depuis septembre 2026, Expo publie la ligne 58 par sa CI (avec preuve), et les
#   correctifs de la 57 à la main, par le mainteneur qui publie toute la 57 depuis juin. À retirer
#   au passage au SDK 58.
# - semver 6.3.1 et ua-parser-js 1.0.41 : anciennes lignes, mêmes mainteneurs ; à la version exacte.
trustPolicyExclude:
  - expo
  - 'expo-*'
  - '@expo/*'
  - babel-preset-expo
  - jest-expo
  - semver@6.3.1
  - ua-parser-js@1.0.41

# Versions imposées à une dépendance indirecte, pour un correctif de sécurité que son parent n'a pas
# encore adopté. Chacune est vérifiée (tests, migrations, captures) et retirée dès que le parent suit.
overrides:
  # uuid < 11.1.1 (GHSA-w5hq-g745-h8pq), amené par xcode via les plugins de configuration d'Expo.
  # xcode fait require('uuid').v4() : la version 11 garde cette forme (CommonJS).
  uuid@<11.1.1: 11.1.1
  # esbuild <= 0.24.2 (GHSA-67mh-4wv8-2f99), amené par @esbuild-kit/core-utils via drizzle-kit, qui
  # n'utilise que la transformation de code, pas le serveur de développement visé par la faille.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # zod < 4.6.6 (GHSA-mrhx-c7xc-m3w5 : mémoire épuisée sur une très grande collection), le zod 3
  # qu'apporte l'outil en ligne de commande d'Expo. Il ne s'en sert que pour lire les greffons de ses
  # outils de développement, avec des fonctions que zod 4 garde (object, string, enum, array, union,
  # literal, url, strict, describe, safeParse, error.issues). Le zod de l'appli et de l'API est déjà
  # le même (4.6.7). À retirer quand @expo/cli passe à zod 4.
  '@expo/cli>zod': 4.6.7
  # decode-uri-component <= 0.4.2 (GHSA-vcc3-ghjq-m6fr : un lien piégé fige l'onglet qui l'ouvre),
  # via query-string 7 dans expo-router, donc dans l'appli web. La version corrigée 0.5.0 n'existe
  # qu'en module ESM : query-string la charge par require(), qui rend alors l'objet du module et non
  # la fonction. Le correctif patches/query-string@7.1.3.patch prend sa fonction `default`, et Jest
  # transforme le paquet (`transformIgnorePatterns` d'apps/app). À retirer (avec le correctif et
  # cette ligne de Jest) quand expo-router ne dépend plus de query-string 7 (SDK Expo 58).
  # 0.5.1 (29/10/2026) corrige aussi GHSA-qr28-fpjm-wq7f (une longue suite de « %xx » rend le
  # décodage quadratique : un lien piégé fige l'onglet). Toujours en module ESM, même correctif.
  'query-string>decode-uri-component': 0.5.1

# Correctifs posés sur une dépendance (`pnpm patch`), chacun expliqué au-dessus de la version
# imposée qui l'exige. Si le paquet change de version, l'installation échoue : on revoit alors le
# correctif au lieu de le perdre en silence.
patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch

# Failles acceptées après examen. Chacune a sa raison, et on la revérifie à chaque mise à jour du SDK Expo.
auditConfig:
  ignoreGhsas:
    # node-forge <= 1.4.0 (GHSA-86w9-cpqp-85rv : une signature RSA PKCS#1 v1.5 contrefaite peut être
    # acceptée), via l'outil en ligne de commande d'Expo (@expo/cli et @expo/code-signing-certificates :
    # certificats du serveur de développement, signature des mises à jour Expo, que Waiggle n'utilise
    # pas). Absent de l'appli et de l'API ; aucune version corrigée publiée.
    - GHSA-86w9-cpqp-85rv
    # (Les exceptions de braces, GHSA-vfj7-8cjw-p6xm, et de sprintf-js, GHSA-hp3w-g68c-fv3c, sont
    # retirées le 25/10/2026 : GitHub a retiré ces deux avis les 22 et 23/10. Celles de zod,
    # GHSA-mrhx-c7xc-m3w5, et de decode-uri-component, GHSA-vcc3-ghjq-m6fr, le 26/10/2026 : corrigées
    # par les versions imposées ci-dessus. Une exception qui ne sert plus cacherait l'avis s'il
    # revenait.)
